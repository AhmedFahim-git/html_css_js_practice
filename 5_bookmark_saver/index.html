<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark Saver</title>
    <link href="style.css" rel="stylesheet" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Bookmark Saver</h1>
      <form>
        <input
          type="text"
          name="bookmark-name"
          id="bookmark-name"
          placeholder="Bookmark Name"
          required
        />
        <input
          type="url"
          name="bookmark-url"
          id="bookmark-url"
          placeholder="Bookmark URL"
          required
        />
        <input
          type="submit"
          name="bookmark-add"
          id="bookmark-add"
          value="Add Bookmark"
        />
      </form>
      <ul></ul>
    </div>
  </body>
</html>
